name: Bootstrap full source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild source archive
        shell: bash
        run: |
          cat .bootstrap/chunk-* | base64 --decode > /tmp/avalonia-workbench.tar.gz
          echo "1dbda20987de38c8a3c37fbd9b3c34d871ba713b8c2241b1fef8f1dd1780fd83  /tmp/avalonia-workbench.tar.gz" | sha256sum --check

      - name: Expand project source
        shell: bash
        run: |
          tar -xzf /tmp/avalonia-workbench.tar.gz -C .
          rm -f .github/workflows/ci-release.yml
          rm -rf .bootstrap

      - name: Commit complete source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "实现 Avalonia Workbench v0.1.0"
          git push origin main
