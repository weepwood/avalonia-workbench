name: Release validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AvaloniaWorkbench.slnx
      - run: dotnet build AvaloniaWorkbench.slnx --configuration Release --no-restore
      - run: dotnet test tests/AvaloniaWorkbench.Tests/AvaloniaWorkbench.Tests.csproj --configuration Release --no-build

  package:
    name: Package ${{ matrix.rid }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: AvaloniaWorkbench-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            archive: AvaloniaWorkbench-linux-x64.tar.gz
          - os: macos-15
            rid: osx-x64
            archive: AvaloniaWorkbench-macos-x64.tar.gz
          - os: macos-15
            rid: osx-arm64
            archive: AvaloniaWorkbench-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        shell: pwsh
        run: >-
          dotnet publish src/AvaloniaWorkbench/AvaloniaWorkbench.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish/${{ matrix.rid }}
      - name: Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          if ("${{ runner.os }}" -eq "Windows") {
            Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "release/${{ matrix.archive }}" -Force
          } else {
            tar -czf "release/${{ matrix.archive }}" -C "publish/${{ matrix.rid }}" .
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish v0.1.0
    needs: package
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          target_commitish: main
          name: Avalonia Workbench v0.1.0
          body: |
            Avalonia Workbench 首个跨平台演示版本。

            - Avalonia 12.1 + .NET 10
            - 仪表盘、数据实验室、文件工作区、任务中心、UI 实验室、诊断中心
            - Windows x64、Linux x64、macOS x64、macOS ARM64 自包含包
            - 已通过构建与单元测试
          files: release-assets/*
          fail_on_unmatched_files: true
          make_latest: true
